<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyGame (Pyxel Web)</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111827;
      --panel: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #22c55e;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: radial-gradient(circle at 20% 20%, #1f2937, #0b1220 70%);
      color: var(--text);
      font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    }
    .wrap {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      width: min(960px, 100%);
      background: color-mix(in srgb, var(--panel) 86%, black);
      border: 1px solid #374151;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }
    h1 {
      font-size: 16px;
      margin: 0 0 6px;
      font-weight: 700;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: var(--accent);
    }
    #error {
      margin-top: 10px;
      color: #fca5a5;
      font-size: 12px;
      display: none;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>MyGame Web版</h1>
      <p>同じフォルダに <code>MyGame.pyxapp</code> を置いた状態で公開してください。</p>
      <div id="status">Pyxelランタイムを読み込み中...</div>
      <div id="error"></div>
    </section>
  </main>

  <script>
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const APP_FILE = "MyGame.pyxapp?v=20260215a";

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function setError(text) {
      errorEl.style.display = "block";
      errorEl.textContent = text;
    }

    window.addEventListener("error", (ev) => {
      setStatus("実行時エラーが発生しました。");
      setError("runtime error: " + (ev.message || "unknown"));
    });

    window.addEventListener("unhandledrejection", (ev) => {
      setStatus("非同期エラーが発生しました。");
      setError("unhandled rejection: " + String(ev.reason || "unknown"));
    });

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = src;
        s.onload = resolve;
        s.onerror = () => reject(new Error("failed: " + src));
        document.head.appendChild(s);
      });
    }

    async function ensureGameFile(path) {
      const res = await fetch(path, { method: "GET", cache: "no-store" });
      if (!res.ok) {
        throw new Error(path + " fetch failed: HTTP " + res.status);
      }
    }

    (async () => {
      try {
        try {
          await loadScript("./pyxel.js");
          setStatus("ローカル pyxel.js を読み込みました。ゲームを起動します...");
        } catch {
          await loadScript("https://cdn.jsdelivr.net/gh/kitao/pyxel@2.5.11/wasm/pyxel.js");
          setStatus("CDN の pyxel.js を読み込みました。ゲームを起動します...");
        }

        setStatus("ゲームデータを確認中...");
        await ensureGameFile(APP_FILE);

        setStatus("ゲームを起動します...");
        launchPyxel({
          command: "play",
          name: APP_FILE,
          gamepad: "enabled"
        });
      } catch (e) {
        setStatus("起動に失敗しました。");
        setError(
          "Web起動エラー: " + e.message + "\n" +
          "1) 同一フォルダに MyGame.pyxapp があるか\n" +
          "2) HTTP サーバー配信か (file:// 直開き不可)\n" +
          "3) pyxel.js が取得できるか"
        );
      }
    })();
  </script>
</body>
</html>
